# Déploiement derrière Nginx Proxy Manager (NPM). Voir README.md, « Déploiement ».
#
# Par défaut, le jeu écoute sur le port 3000 de la machine : dans NPM, on vise
# http://IP-de-la-machine:3000. Pour joindre plutôt le conteneur par le réseau Docker de
# NPM (sans ouvrir de port), utiliser en plus docker-compose.npm.yml (voir ce fichier).
services:
  poker:
    build: .
    image: poker-interco:latest
    container_name: poker
    restart: unless-stopped
    ports:
      - '${POKER_PORT:-3000}:3000'
    environment:
      # Derrière NPM : la vraie IP des joueurs est dans X-Real-IP (limites par IP).
      TRUST_PROXY: '1'
    volumes:
      # Classement des joueurs : survit aux mises à jour et aux redémarrages.
      - poker-data:/app/data
    # Durcissement : même si une faille permettait d'exécuter du code dans le conteneur,
    # il ne pourrait ni modifier l'image, ni gagner de privilèges, ni épuiser la machine.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    pids_limit: 100
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

volumes:
  poker-data:
